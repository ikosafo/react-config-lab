name: Deploy Configuration To Key Vault

on:
  push:
    branches:
      - Florence-branch
      - develop
  pull_request:
    branches:
      - Florence-branch
      - develop

permissions:
  contents: read

env:
  CONFIG_FILE: config/keyvault-secrets.json

jobs:
  validate-config:
    name: Validate Config JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate JSON file exists
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Missing config file: $CONFIG_FILE"
            exit 1
          fi

      - name: Validate JSON structure
        run: |
          jq empty "$CONFIG_FILE"
          if ! jq -e 'type == "object"' "$CONFIG_FILE" > /dev/null; then
            echo "Config file must be a JSON object of key-value pairs."
            exit 1
          fi

  deploy-to-keyvault:
    name: Deploy Secrets To Azure Key Vault
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Azure login using Service Principal
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          if [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          fi

      - name: Upload key-value pairs to Key Vault
        shell: bash
        env:
          KEY_VAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          if [ -z "$KEY_VAULT_NAME" ]; then
            KEY_VAULT_NAME="kv-hzb-c2-config"
            echo "AZURE_KEYVAULT_NAME not set; defaulting to $KEY_VAULT_NAME"
          fi

          while IFS= read -r key; do
            value=$(jq -r --arg k "$key" '.[$k]' "$CONFIG_FILE")

            if [ "$value" = "null" ]; then
              echo "Skipping $key because value is null"
              continue
            fi

            az keyvault secret set \
              --vault-name "$KEY_VAULT_NAME" \
              --name "$key" \
              --value "$value" \
              --output none

            echo "Uploaded secret: $key"
          done < <(jq -r 'keys[]' "$CONFIG_FILE")
