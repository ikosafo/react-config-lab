name: Deploy Config To Azure Key Vault

#  Basic workflow to deploy configuration secrets to Azure Key Vault
# Triggers:
#  - push to Florence-branch and develop
#  - pull_request to Florence-branch and develop (validation only)
on:
  push:
    branches:
      - Florence-branch
      - develop
  pull_request:
    branches:
      - Florence-branch
      - develop

permissions:
  contents: read

# Shared/global environment variables used in both jobs
env:
  CONFIG_FILE: src/config/keyvault-secrets.json
  DEFAULT_KEY_VAULT_NAME: kv-hzb-c2-config

jobs:
  # Validation job (runs on both push and PR) - lightweight checks
  validate-config:
    name: Validate Config JSON
    runs-on: ubuntu-latest
    env:
      CONFIG_FILE: ${{ github.event_name == 'pull_request' && 'src/config/test-secrets.json' || 'src/config/keyvault-secrets.json' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print workflow context
        shell: bash
        run: |
          set -euo pipefail
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Config file: $CONFIG_FILE"

      - name: Ensure jq is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Validate JSON file exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: Missing config file: $CONFIG_FILE"
            exit 1
          fi

      - name: Validate JSON structure
        shell: bash
        run: |
          set -euo pipefail
          jq empty "$CONFIG_FILE"

      - name: Validate required keys exist
        shell: bash
        run: |
          set -euo pipefail

          # Define required keys based on config file
          if [[ "$CONFIG_FILE" == *"test-secrets.json" ]]; then
            # Test file requires: API_BASE_URL, APP_ENV
            required_keys=("API_BASE_URL" "APP_ENV")
          else
            # requires the Key Vault secret names mapped to the app
            required_keys=("react-app-api-url" "environment")
          fi

          missing_keys=()
          for key in "${required_keys[@]}"; do
            if ! jq -e --arg k "$key" 'has($k)' "$CONFIG_FILE" > /dev/null 2>&1; then
              missing_keys+=("$key")
            fi
          done

          if [ "${#missing_keys[@]}" -ne 0 ]; then
            printf 'ERROR: Missing required keys in %s:\n' "$CONFIG_FILE"
            printf '  - %s\n' "${missing_keys[@]}"
            exit 1
          fi

          printf 'OK: All required keys found in %s\n' "$CONFIG_FILE"

      - name: Validate config values
        shell: bash
        run: |
          set -euo pipefail

          empty_keys=()
          invalid_url_keys=()

          while IFS=$'\t' read -r key value; do
            if [ -z "$value" ]; then
              empty_keys+=("$key")
            fi

            if printf '%s' "$key" | grep -qi 'url'; then
              if [ -n "$value" ] && [[ "$value" != https://* ]]; then
                invalid_url_keys+=("$key=$value")
              fi
            fi
          done < <(jq -r 'to_entries[] | [.key, (if .value == null then "" elif (.value | type) == "string" then .value else (.value | tostring) end)] | @tsv' "$CONFIG_FILE")

          if [ "${#empty_keys[@]}" -ne 0 ]; then
            printf 'ERROR: Empty values found in %s:\n' "$CONFIG_FILE"
            printf '  - %s\n' "${empty_keys[@]}"
            exit 1
          fi

          if [ "${#invalid_url_keys[@]}" -ne 0 ]; then
            printf 'ERROR: URL keys must start with https:// in %s:\n' "$CONFIG_FILE"
            printf '  - %s\n' "${invalid_url_keys[@]}"
            exit 1
          fi

          printf 'OK: No empty values or invalid URL values found in %s\n' "$CONFIG_FILE"

  # Deployment job: only runs on push (not on PR)
  deploy-to-keyvault:
    name: Deploy Secrets To Azure Key Vault
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print workflow context
        shell: bash
        run: |
          set -euo pipefail
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Config file: $CONFIG_FILE"

      - name: Validate Azure secrets are configured
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${AZURE_CLIENT_ID:-}" ] || missing+=("AZURE_CLIENT_ID")
          [ -n "${AZURE_CLIENT_SECRET:-}" ] || missing+=("AZURE_CLIENT_SECRET")
          [ -n "${AZURE_TENANT_ID:-}" ] || missing+=("AZURE_TENANT_ID")

          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'ERROR: Missing required GitHub secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Ensure jq is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Azure login using Service Principal
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          if [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          fi

      - name: Configuration drift detection (warn-only)
        shell: bash
        env:
          KEY_VAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          set -euo pipefail

          if ! command -v az >/dev/null 2>&1; then
            echo "az CLI not available; skipping drift detection."
            exit 0
          fi

          if [ -z "${KEY_VAULT_NAME:-}" ]; then
            KEY_VAULT_NAME="$DEFAULT_KEY_VAULT_NAME"
            echo "AZURE_KEYVAULT_NAME not set; defaulting to $KEY_VAULT_NAME"
          fi

          echo "Listing Key Vault secrets from $KEY_VAULT_NAME..."
          if ! az keyvault secret list --vault-name "$KEY_VAULT_NAME" --query "[].name" -o tsv | sort > /tmp/kv_keys.txt; then
            echo "WARNING: unable to list secrets from Key Vault; skipping drift comparison."
            exit 0
          fi

          echo "Reading keys from $CONFIG_FILE..."
          jq -r 'keys[]' "$CONFIG_FILE" | sort > /tmp/local_keys.txt

          missing_in_kv=$(comm -23 /tmp/local_keys.txt /tmp/kv_keys.txt || true)
          missing_in_cfg=$(comm -13 /tmp/local_keys.txt /tmp/kv_keys.txt || true)
          common=$(comm -12 /tmp/local_keys.txt /tmp/kv_keys.txt || true)

          echo "=== Drift report ==="
          echo "Keys in config but missing from Key Vault:"
          if [ -z "$missing_in_kv" ]; then echo "  (none)"; else echo "$missing_in_kv"; fi

          echo "Keys in Key Vault but missing from config:"
          if [ -z "$missing_in_cfg" ]; then echo "  (none)"; else echo "$missing_in_cfg"; fi

          echo "Keys present in both:"
          if [ -z "$common" ]; then echo "  (none)"; else echo "$common"; fi

          if [ -n "$missing_in_kv" ] || [ -n "$missing_in_cfg" ]; then
            echo "WARNING: configuration drift detected (non-fatal)."
          else
            echo "OK: no drift detected."
          fi

          exit 0

      - name: Verify target Key Vault is reachable
        shell: bash
        env:
          KEY_VAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${KEY_VAULT_NAME:-}" ]; then
            KEY_VAULT_NAME="$DEFAULT_KEY_VAULT_NAME"
            echo "AZURE_KEYVAULT_NAME not set; defaulting to $KEY_VAULT_NAME"
          fi

          az keyvault show --name "$KEY_VAULT_NAME" --output none

      - name: Upload key-value pairs to Key Vault
        shell: bash
        env:
          KEY_VAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${KEY_VAULT_NAME:-}" ]; then
            KEY_VAULT_NAME="$DEFAULT_KEY_VAULT_NAME"
            echo "AZURE_KEYVAULT_NAME not set; defaulting to $KEY_VAULT_NAME"
          fi

          while IFS= read -r key; do
            value=$(jq -r --arg k "$key" '.[$k]' "$CONFIG_FILE")
            if [ "$value" = "null" ]; then
              echo "Skipping $key because value is null"
              continue
            fi

            az keyvault secret set \
              --vault-name "$KEY_VAULT_NAME" \
              --name "$key" \
              --value "$value" --output none

            echo "Uploaded secret: $key"
          done < <(jq -r 'keys[]' "$CONFIG_FILE")
