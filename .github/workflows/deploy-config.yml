# Workflow name shown in the GitHub Actions UI.
name: Deploy Config To Azure Key Vault

# Run this workflow when code is pushed to deployment branches 
# and when pull requests target those branches.
on:
  push:
    branches:
      - Florence-branch
      - develop
  pull_request:
    branches:
      - Florence-branch
      - develop

# Minimal permission required to read repository content.
permissions:
  contents: read

# Shared path to the JSON file that contains key-value pairs.
env:
  CONFIG_FILE: src/config/keyvault-secrets.json

jobs:
  # PR-safe validation job: checks config quality without writing to Azure.
  validate-config:
    name: Validate Config JSON
    runs-on: ubuntu-latest
    steps:
      # Pull repository files into the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install jq for JSON parsing and validation.
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Fail fast if the expected JSON config file is missing.
      - name: Validate JSON file exists
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Missing config file: $CONFIG_FILE"
            exit 1
          fi

      # Confirm valid JSON and enforce top-level object format.
      - name: Validate JSON structure
        run: |
          jq empty "$CONFIG_FILE"
          if ! jq -e 'type == "object"' "$CONFIG_FILE" > /dev/null; then
            echo "Config file must be a JSON object of key-value pairs."
            exit 1
          fi

  # Deployment job: runs only on push after validation succeeds.
  deploy-to-keyvault:
    name: Deploy Secrets To Azure Key Vault
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      # Pull repository files into the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install jq to iterate through JSON keys and values.
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Sign in to Azure using service principal credentials from GitHub secrets.
      - name: Azure login using Service Principal
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          if [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          fi

      # Loop through each JSON key-value pair and store it as a Key Vault secret.
      - name: Upload key-value pairs to Key Vault
        shell: bash
        env:
          KEY_VAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          # Use repository secret when available; otherwise use the team default vault.
          if [ -z "$KEY_VAULT_NAME" ]; then
            KEY_VAULT_NAME="kv-hzb-c2-config"
            echo "AZURE_KEYVAULT_NAME not set; defaulting to $KEY_VAULT_NAME"
          fi

          # Iterate over every key in the config file.
          while IFS= read -r key; do
            value=$(jq -r --arg k "$key" '.[$k]' "$CONFIG_FILE")

            # Skip null values to avoid writing empty placeholder secrets.
            if [ "$value" = "null" ]; then
              echo "Skipping $key because value is null"
              continue
            fi

            # Create or update each secret in the target Key Vault.
            az keyvault secret set \
              --vault-name "$KEY_VAULT_NAME" \
              --name "$key" \
              --value "$value" \
              --output none

            echo "Uploaded secret: $key"
          done < <(jq -r 'keys[]' "$CONFIG_FILE")
